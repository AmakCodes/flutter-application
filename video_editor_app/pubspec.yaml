name: video_editor_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.2
  http: ^0.13.6
  permission_handler: ^11.0.0
  image_picker: ^1.0.4
  video_player: ^2.7.0
  path_provider: ^2.1.2
  file_picker: ^5.2.10
  gallery_saver: ^2.3.2
  ffmpeg_kit_flutter_min_gpl: ^6.0.3




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png